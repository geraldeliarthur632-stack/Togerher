<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="110" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <path d="M 80 180 C 80 140 120 140 140 160 C 160 130 210 140 220 170 C 240 170 250 200 230 210 L 90 210 C 70 210 70 190 80 180 Z" fill="#ffffff" opacity="0.35"/>
  <path d="M 330 130 C 330 100 360 100 375 115 C 390 95 430 100 440 125 C 455 125 465 150 450 160 L 340 160 C 325 160 325 140 330 130 Z" fill="#ffffff" opacity="0.4"/>

  <!-- Golden base podium -->
  <ellipse cx="256" cy="400" rx="140" ry="35" fill="url(#podiumGrad)" filter="url(#shadow)"/>
  <ellipse cx="256" cy="392" rx="125" ry="26" fill="#fef9c3"/>

  <!-- Blue Hero Character P1 -->
  <g transform="translate(190, 240)" filter="url(#shadow)">
    <!-- Legs -->
    <rect x="-24" y="60" width="16" height="30" rx="8" fill="#1e293b"/>
    <rect x="8" y="60" width="16" height="30" rx="8" fill="#1e293b"/>
    <!-- Body -->
    <rect x="-55" y="-55" width="110" height="125" rx="35" fill="#3b82f6"/>
    <!-- Belly -->
    <rect x="-35" y="-20" width="70" height="75" rx="22" fill="#bfdbfe"/>
    <!-- Eyes -->
    <circle cx="-16" cy="-15" r="9" fill="#0f172a"/>
    <circle cx="16" cy="-15" r="9" fill="#0f172a"/>
    <circle cx="-13" cy="-18" r="3.5" fill="#ffffff"/>
    <circle cx="19" cy="-18" r="3.5" fill="#ffffff"/>
    <!-- Cheeks -->
    <circle cx="-32" cy="-2" r="7" fill="#f43f5e" opacity="0.5"/>
    <circle cx="32" cy="-2" r="7" fill="#f43f5e" opacity="0.5"/>
    <!-- Smile -->
    <path d="M -8 2 Q 0 12 8 2" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Crown -->
    <polygon points="-30,-50 -20,-80 0,-60 20,-80 30,-50" fill="#f59e0b"/>
    <circle cx="0" cy="-60" r="4" fill="#ef4444"/>
  </g>

  <!-- Pink Hero Character P2 (Co-op buddy) -->
  <g transform="translate(325, 275)" filter="url(#shadow)">
    <!-- Legs -->
    <rect x="-18" y="45" width="12" height="24" rx="6" fill="#1e293b"/>
    <rect x="6" y="45" width="12" height="24" rx="6" fill="#1e293b"/>
    <!-- Body -->
    <rect x="-42" y="-42" width="84" height="96" rx="28" fill="#ec4899"/>
    <!-- Belly -->
    <rect x="-26" y="-15" width="52" height="56" rx="16" fill="#fbcfe8"/>
    <!-- Eyes -->
    <circle cx="-12" cy="-12" r="7" fill="#0f172a"/>
    <circle cx="12" cy="-12" r="7" fill="#0f172a"/>
    <circle cx="-10" cy="-14" r="2.5" fill="#ffffff"/>
    <circle cx="14" cy="-14" r="2.5" fill="#ffffff"/>
    <!-- Cheeks -->
    <circle cx="-24" cy="-2" r="5" fill="#fb7185" opacity="0.6"/>
    <circle cx="24" cy="-2" r="5" fill="#fb7185" opacity="0.6"/>
    <!-- Smile -->
    <path d="M -6 2 Q 0 9 6 2" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
