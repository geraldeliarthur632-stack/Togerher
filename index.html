    <script>
      // Filter Vite HMR WebSocket errors (HMR is disabled in AI Studio dev environment per instructions)
      (() => {
        const isWsHmrError = (val) => {
          if (!val) return false;
          const str = String(val?.message || val?.stack || val || '');
          return str.includes('WebSocket closed without opened') ||
                 str.includes('failed to connect to websocket') ||
                 str.includes('WebSocket closed') ||
                 (str.includes('[vite]') && (str.includes('WebSocket') || str.includes('connection')));
        };

        const origError = console.error;
        console.error = function (...args) {
          const hasWsError = args.some(arg => isWsHmrError(arg));
          if (hasWsError) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('error', (event) => {
          if (isWsHmrError(event.message) || isWsHmrError(event.error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          if (isWsHmrError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Early capture of beforeinstallprompt for instant installation
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          window.__pwaInstallPrompt = e;
        });
      })();
    </script>
  </head>
  <body class="bg-sky-100 text-slate-800 select-none min-h-screen">
